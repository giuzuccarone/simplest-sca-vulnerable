name: Checkmarx SCA Scan

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkmarx-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate project directory
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ./node-app/package.json ]; then
            echo "::error::Arquivo node-app/package.json não encontrado."
            echo "Arquivos encontrados no repositório:"
            find . -maxdepth 3 -name package.json
            exit 1
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            libgssapi-krb5-2

      - name: Install project dependencies
        working-directory: ./node-app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Download Checkmarx One CLI
        shell: bash
        env:
          CX_CLI_VERSION: "2.3.67"
        run: |
          set -euo pipefail

          CLI_DIR="${RUNNER_TEMP}/cx-cli"
          ARCHIVE="ast-cli_${CX_CLI_VERSION}_linux_x64.tar.gz"
          DOWNLOAD_URL="https://github.com/Checkmarx/ast-cli/releases/download/${CX_CLI_VERSION}/${ARCHIVE}"

          mkdir -p "${CLI_DIR}"

          curl --fail --location --retry 3 \
            "${DOWNLOAD_URL}" \
            --output "${RUNNER_TEMP}/${ARCHIVE}"

          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" \
            -C "${CLI_DIR}"

          chmod +x "${CLI_DIR}/cx"

          "${CLI_DIR}/cx" version
          
      - name: Download Checkmarx SCA Resolver
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/sca-resolver"

          curl --fail --location --retry 3 \
            "https://sca-downloads.s3.amazonaws.com/cli/latest/ScaResolver-linux64.tar.gz" \
            --output "${RUNNER_TEMP}/ScaResolver-linux64.tar.gz"

          tar -xzf "${RUNNER_TEMP}/ScaResolver-linux64.tar.gz" \
            -C "${RUNNER_TEMP}/sca-resolver"

          chmod +x "${RUNNER_TEMP}/sca-resolver/ScaResolver"

      - name: Run Checkmarx One SCA Scan
        shell: bash
        env:
          CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
          CX_BASE_AUTH_URI: ${{ secrets.CX_BASE_AUTH_URI }}
          CX_TENANT: ${{ secrets.CX_TENANT }}
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
          SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          for variable in \
            CX_BASE_URI \
            CX_BASE_AUTH_URI \
            CX_TENANT \
            CX_CLIENT_ID \
            CX_CLIENT_SECRET; do

            if [ -z "${!variable:-}" ]; then
              echo "::error::Secret obrigatório não configurado: ${variable}"
              exit 1
            fi
          done

          "${RUNNER_TEMP}/cx-cli/cx" scan create \
            --project-name "simplest-sca-vulnerable-nodejs" \
            -s "${GITHUB_WORKSPACE}/node-app" \
            --branch "${SCAN_BRANCH}" \
            --sca-resolver "${RUNNER_TEMP}/sca-resolver/ScaResolver"
